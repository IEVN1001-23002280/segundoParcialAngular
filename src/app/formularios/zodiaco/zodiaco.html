<br /><br /><br />
<div class="max-w-4xl mx-auto p-6 bg-white rounded-lg shadow">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <form [formGroup]="formulario" (ngSubmit)="imprimir()">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Datos Personales</h2>

      <div class="mb-4">
        <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        />
      </div>

      <div class="mb-4">
        <label for="aPaterno" class="block mb-2 text-sm font-medium text-gray-900">APaterno</label>
        <input
          type="text"
          id="aPaterno"
          formControlName="aPaterno"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        />
      </div>

      <div class="mb-4">
        <label for="aMaterno" class="block mb-2 text-sm font-medium text-gray-900">AMaterno</label>
        <input
          type="text"
          id="aMaterno"
          formControlName="aMaterno"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        />
      </div>

      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium text-gray-900">Fecha de nacimiento</label>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <span class="text-xs text-gray-500">Día</span>
            <input
              type="number"
              formControlName="dia"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            />
          </div>
          <div>
            <span class="text-xs text-gray-500">Mes</span>
            <input
              type="number"
              formControlName="mes"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            />
          </div>
          <div>
            <span class="text-xs text-gray-500">Año</span>
            <input
              type="number"
              formControlName="anio"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
            />
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium text-gray-900">sexo</label>
        <div class="flex items-center space-x-4">
          <div class="flex items-center">
            <input
              type="radio"
              id="masculino"
              value="Masculino"
              formControlName="sexo"
              class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
            />
            <label for="masculino" class="ms-2 text-sm text-gray-900">Masculino</label>
          </div>
          <div class="flex items-center">
            <input
              type="radio"
              id="femenino"
              value="Femenino"
              formControlName="sexo"
              class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
            />
            <label for="femenino" class="ms-2 text-sm text-gray-900">Femenino</label>
          </div>
        </div>
      </div>

      <div class="mt-6">
        <button
          type="submit"
          class="text-white bg-green-900 border border-gray-300 focus:outline-none hover:bg-green-400 hover:text-black focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 w-full"
        >
          imprimir
        </button>
      </div>
    </form>

    <div class="flex flex-col justify-center items-center text-center space-y-4 border-l border-gray-200 pl-6">
      <h2 class="text-2xl text-gray-900">
        Hola {{ nombreCompleto }}
      </h2>

      <p class="text-2xl text-gray-900">
        Tienes {{ edad }} años
      </p>

      <p class="text-2xl text-gray-900">
        tu signo zodiacal
      </p>

      <img [src]="imagenSigno" alt="Signo" class="w-32 h-32 object-contain" />

      <p class="text-2xl text-gray-900">
        Es {{ signoChino }}
      </p>
    </div>

  </div>
</div>
